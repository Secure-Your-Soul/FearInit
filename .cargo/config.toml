[build]
target = "x86_64-unknown-linux-musl"
# Jamy zapis dla każdej architektury MUSL z osobna:
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lgcc_eh"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lgcc_eh"]

[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lgcc_eh"]

# Pozostałe ustawienia dla GNU (bez zmian)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"

# ŚWIAT NONE
[target.'cfg(target_os = "none")']
rustflags = ["-C", "link-arg=-nostartfiles"]
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
overflow-checks = false

[profile.dev]
opt-level = 0    # Max Compression
lto = false     # How much compile
codegen-units = 16  # One big block of code (Better compresion)
panic = 'unwind'    # Deleting Panic Code Resolver (Binary is smaller)
strip = false       # Deleting symbols
overflow-checks = true # Turning off overflows when FALSE (More fast but dangerous)