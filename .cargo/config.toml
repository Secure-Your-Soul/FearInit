[build]
target = "x86_64-unknown-linux-musl"

# ==========================================
# 1. LINUX (MUSL) - for initramfs and ISO
# ==========================================
[target.'cfg(all(target_os = "linux", target_env = "musl"))']
linker = "rust-lld"
rustflags = [
    # --- HARDWARE / SPEED ---
    "-C", "target-cpu=native",                          # Optimize code generation for the host CPU architecture
    
    # --- SECURITY (HARDENING) ---
    "-C", "target-feature=+crt-static",                 # Statically embed the musl C runtime
    "-C", "relocation-model=pie",                       # Enable Position Independent Executable layout
    #"-C", "stack-protector=strong",                    # Insert stack canaries to detect buffer overflows | dont workig maybe is in nightly so we must wait to stable
    "-C", "link-arg=-z", "-C", "link-arg=now",          # Force immediate symbol binding (disable lazy binding)
    "-C", "link-arg=-z", "-C", "link-arg=relro",        # Mark Global Offset Table as read-only (Full RELRO)
    "-C", "link-arg=-z", "-C", "link-arg=defs",         # Zero tolerance for any unresolved symbols during linking
    
    # --- LINKER & SIZE OPTIMIZATIONS ---
    "-C", "link-self-contained=yes",                    # Use self-contained linking artifacts for toolchain consistency
    "-C", "link-arg=-Bstatic",                          # Prefer static libraries over dynamic ones
    "-C", "link-arg=-z", "-C", "link-arg=notext",       # Allow text relocations required by static PIE bootstrap
    "-C", "link-arg=--no-dynamic-linker",               # Omit the dynamic interpreter path (pure standalone binary)
    "-C", "link-arg=--as-needed",                       # Drop unreferenced shared libraries from the link stage
    "-C", "link-arg=-s",                                # Strip remaining symbols directly at the linker level
    "-C", "symbol-mangling-version=v0",                 # Use modern v0 symbol mangling for better compression
    "-C", "link-arg=--gc-sections",                     # Garbage collect unused code and data sections
    "-C", "link-arg=-O3",                               # Maximum optimization level for the linker itself
    "-C", "link-arg=--build-id=none",                   # Remove Build-ID for smaller size and hardened footprint
]

# ==========================================
# 2. BARE-METAL (NONE) - common to all
# ==========================================
[target.'cfg(target_os = "none")']
linker = "rust-lld" # Default, but good to have explicitly
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "panic=abort", 
]

# ==========================================
# 3. BARE-METAL - linker scripts for architectures
# ==========================================
# Cargo will automatically merge these flags with the "none" section above!
[target.x86_64-unknown-none]
rustflags = [
#    "-C", "link-arg=-Tlinker-x86_64.ld",
    "-C", "relocation-model=static",
]

[target.aarch64-unknown-none]
rustflags = [
#    "-C", "link-arg=-Tlinker-aarch64.ld",
    "-C", "relocation-model=static",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
#    "-C", "link-arg=-Tlinker-riscv64.ld",
    "-C", "relocation-model=static",
]