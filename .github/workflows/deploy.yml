name: CI/CD

on:
  push:
    branches: [ stable ]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings -D clippy::pedantic -D clippy::nursery -D clippy::cargo -W clippy::unwrap_used -W clippy::expect_used

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-features --all-targets --no-fail-fast --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          components: llvm-tools-preview
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info --locked
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          path-to-lcov: ./lcov.info
          fail-on-error: false

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  check:
    needs: [fmt, clippy, tests, coverage, audit, docs, deny]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Get Version
        id: ver
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          
      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "is_new=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.ver.outputs.version }} already exists. Skipping build and release."
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
            echo "New version v${{ steps.ver.outputs.version }} detected. Proceeding with build."
          fi

  build:
    needs: [check]
    if: needs.check.outputs.is_new == 'true'
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        # --- x86_64 ---
          - target: x86_64-unknown-linux-musl
            cpu: x86-64
            name: x86_64
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v2
            name: x86_64-v2
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v3
            name: x86_64-v3
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v4
            name: x86_64-v4
            
        # --- aarch64 ---
          - target: aarch64-unknown-linux-musl
            cpu: generic
            name: aarch64
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a34
            name: aarch64-cortex-a34
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a35
            name: aarch64-cortex-a35
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a53
            name: aarch64-cortex-a53
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a55
            name: aarch64-cortex-a55
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a57
            name: aarch64-cortex-a57
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a72
            name: aarch64-cortex-a72
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a73
            name: aarch64-cortex-a73
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a75
            name: aarch64-cortex-a75
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a76
            name: aarch64-cortex-a76
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a510
            name: aarch64-cortex-a510
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a710
            name: aarch64-cortex-a710
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a715
            name: aarch64-cortex-a715
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-x1
            name: aarch64-cortex-x1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-x2
            name: aarch64-cortex-x2
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-n1
            name: aarch64-neoverse-n1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-n2
            name: aarch64-neoverse-n2
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-v1
            name: aarch64-neoverse-v1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-e1
            name: aarch64-neoverse-e1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: apple-m1
            name: aarch64-apple-m1
            experimental: true

        # --- riscv64 ---
          - target: riscv64gc-unknown-linux-musl
            cpu: generic
            name: riscv64
            experimental: true
          - target: riscv64gc-unknown-linux-musl
            cpu: sifive-u54
            name: riscv64-sifive-u54
            experimental: true
          - target: riscv64gc-unknown-linux-musl
            cpu: sifive-u74
            name: riscv64-sifive-u74
            experimental: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ matrix.cpu }}
      
      - name: Set Target CPU in config
        shell: bash
        run: |
          sed -i 's/target-cpu=native/target-cpu=${{ matrix.cpu }}/g' .cargo/config.toml

      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }} --locked

      - name: Rename and Upload
        shell: bash
        run: |
          NEW_NAME="FearInit-${{ matrix.name }}"
          BIN_PATH="target/${{ matrix.target }}/release/FearInit"
          mv "$BIN_PATH" "$NEW_NAME"
          echo "artifact_path=$NEW_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FearInit-${{ matrix.name }}
          path: ${{ env.artifact_path }}
          retention-days: 7
 
  build_dev:
    needs: [check]
    if: needs.check.outputs.is_new == 'true'
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        # --- x86_64 ---
          - target: x86_64-unknown-linux-musl
            cpu: x86-64
            name: x86_64
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v2
            name: x86_64-v2
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v3
            name: x86_64-v3
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v4
            name: x86_64-v4
            
        # --- aarch64 ---
          - target: aarch64-unknown-linux-musl
            cpu: generic
            name: aarch64
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a34
            name: aarch64-cortex-a34
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a35
            name: aarch64-cortex-a35
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a53
            name: aarch64-cortex-a53
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a55
            name: aarch64-cortex-a55
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a57
            name: aarch64-cortex-a57
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a72
            name: aarch64-cortex-a72
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a73
            name: aarch64-cortex-a73
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a75
            name: aarch64-cortex-a75
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a76
            name: aarch64-cortex-a76
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a510
            name: aarch64-cortex-a510
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a710
            name: aarch64-cortex-a710
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a715
            name: aarch64-cortex-a715
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-x1
            name: aarch64-cortex-x1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-x2
            name: aarch64-cortex-x2
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-n1
            name: aarch64-neoverse-n1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-n2
            name: aarch64-neoverse-n2
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-v1
            name: aarch64-neoverse-v1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-e1
            name: aarch64-neoverse-e1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: apple-m1
            name: aarch64-apple-m1
            experimental: true

        # --- riscv64 ---
          - target: riscv64gc-unknown-linux-musl
            cpu: generic
            name: riscv64
            experimental: true
          - target: riscv64gc-unknown-linux-musl
            cpu: sifive-u54
            name: riscv64-sifive-u54
            experimental: true
          - target: riscv64gc-unknown-linux-musl
            cpu: sifive-u74
            name: riscv64-sifive-u74
            experimental: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # v1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ matrix.cpu }}-dev
      
      - name: Set Target CPU in config
        shell: bash
        run: |
          sed -i 's/target-cpu=native/target-cpu=${{ matrix.cpu }}/g' .cargo/config.toml

      - name: Build
        run: cargo build --all-features --target ${{ matrix.target }} --locked

      - name: Rename and Upload
        shell: bash
        run: |
          NEW_NAME="FearInit-${{ matrix.name }}-dev"
          BIN_PATH="target/${{ matrix.target }}/debug/FearInit"
          mv "$BIN_PATH" "$NEW_NAME"
          echo "artifact_path=$NEW_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FearInit-${{ matrix.name }}-dev
          path: ${{ env.artifact_path }}
          retention-days: 7

  release:
    needs: [check, build, build_dev]
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.check.outputs.version }}
          files: |
            artifacts/**
          generate_release_notes: true
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}